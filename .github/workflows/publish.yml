name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Test and publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm trusted publishing (OIDC)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # No registry-url: it would write an .npmrc with ${NODE_AUTH_TOKEN}, which is not used
          # here and would shadow the OIDC identity.
          cache: npm
          package-manager-cache: false # never use a cache in a release build

      - name: Ensure npm supports trusted publishing
        # Trusted publishing needs npm CLI >= 11.5.1; Node 22 still bundles npm 10.x.
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix testkit

      - name: Run verification
        run: |
          npm run typecheck
          npm test
          npm run verify:package

      # Authentication is the workflow's OIDC identity (npm trusted publishing), no token needed.
      # Provenance is generated automatically for trusted publishers of public packages.
      - name: Publish paseo-scripted-provider
        run: npm publish --access public

      - name: Publish paseo-scripted-provider-testkit
        run: npm publish ./testkit --access public

      - name: Verify the published package in a real daemon
        # The only check that proves the tarball a user installs works: install it from the
        # registry into an isolated daemon and run a scenario.
        run: npm run e2e:npm
        env:
          E2E_NPM_VERSION: ${{ github.event.release.tag_name }}
          E2E_OUT: ${{ runner.temp }}/e2e-logs
