version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-deps:
        dependency-type: development
        patterns:
          - "*"
    ignore:
      # React must match the Paseo plugin SDK's peer range (@getpaseo/plugin wants react@~19.1.0).
      - dependency-name: "react"
      - dependency-name: "@types/react"
      # react-native pins the Hermes compiler that `npm run check:hermes` validates the client
      # bundle against - the same engine the Paseo iOS app runs. Upgrading it silently changes
      # what the check proves.
      - dependency-name: "react-native"

  - package-ecosystem: npm
    directory: "/testkit"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      testkit-deps:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
