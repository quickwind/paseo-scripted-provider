version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-deps:
        dependency-type: development
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: "/testkit"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      testkit-deps:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
